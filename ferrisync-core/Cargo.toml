[package]
name = "ferrisync-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[features]
default = ["flutter"]
flutter = ["dep:flutter_rust_bridge"]

[dependencies]
tokio.workspace = true
serde.workspace = true
anyhow.workspace = true
thiserror.workspace = true
blake3.workspace = true
uuid.workspace = true
mdns-sd.workspace = true
notify.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
rcgen.workspace = true
rusqlite.workspace = true
bincode.workspace = true
log.workspace = true
async-trait.workspace = true
whoami.workspace = true
tokio-rustls.workspace = true
flutter_rust_bridge = { version = "=2.12.0", optional = true }

[dev-dependencies]
serde_json.workspace = true
env_logger.workspace = true
tempfile = "3"
# `test-util` (paused/auto-advanced clock) for deterministic timeout tests.
tokio = { workspace = true, features = ["test-util"] }
# Property-based tests for path validation and chunk sequencing.
proptest = "1"
