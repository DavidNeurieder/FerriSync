name: CI

on:
  push:
  pull_request:

# Cancel a superseded run when new commits land on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — fmt, clippy, tests (${{ matrix.os }})
    # The security and regression suite must pass on every supported platform.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Formatting and lints are platform-independent; run them once.
      - name: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: cargo clippy (deny warnings)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  flutter:
    name: Flutter — analyze, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ferrisync-flutter
    steps:
      - uses: actions/checkout@v4

      # The bridge code generator parses the Rust crate, so a Rust toolchain
      # must be present before codegen runs.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ferrisync-core

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version ^2.12.0 --locked

      # lib/gen is generated (and git-ignored), so it must be produced before
      # analyze/test can resolve the bridge bindings.
      - name: Generate the Rust/Dart bridge
        run: flutter_rust_bridge_codegen generate

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test
