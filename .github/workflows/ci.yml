name: CI

on:
  push:
    branches: [ main, publishv0.1.0 ]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust tests
        run: cargo test --workspace

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to match the project's tested toolchain. Floating stable
          # (currently 3.50) introduces new analyzer infos and Gradle requirements.
          flutter-version: '3.41.2'
      - name: Flutter pub get
        working-directory: ferrisync-flutter
        run: flutter pub get
      - name: Analyze
        working-directory: ferrisync-flutter
        run: flutter analyze
      - name: Test
        working-directory: ferrisync-flutter
        run: flutter test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to match the project's tested toolchain. Floating stable
          # (currently 3.50) requires Gradle >= 9.3.1 for Android builds.
          flutter-version: '3.41.2'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          add-to-path: false
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Flutter pub get
        working-directory: ferrisync-flutter
        run: flutter pub get
      - name: Build Android APK
        working-directory: ferrisync-flutter
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: flutter build apk --release

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip maturin pytest ruff mypy
      - name: Build and install Python bindings
        run: python -m pip install ./ferrisync-python
      - name: Lint Python package
        run: python -m ruff check ferrisync-python/python ferrisync-python/tests ferrisync-python/examples
      - name: Type check Python package
        run: python -m mypy ferrisync-python/python ferrisync-python/tests
      - name: Python syntax check
        run: python3 -m py_compile ferrisync-python/python/ferrisync/__init__.py ferrisync-python/examples/basic_usage.py ferrisync-python/examples/async_usage.py ferrisync-python/examples/discovery.py ferrisync-python/tests/conftest.py ferrisync-python/tests/helpers/__init__.py ferrisync-python/tests/helpers/assertions.py ferrisync-python/tests/helpers/processes.py ferrisync-python/tests/helpers/scenarios.py ferrisync-python/tests/test_smoke.py ferrisync-python/tests/test_two_client_integration.py ferrisync-python/tests/test_lifecycle_and_multi_client.py ferrisync-python/tests/test_cli_interop.py ferrisync-python/tests/test_reliability_matrix.py ferrisync-python/tests/test_restart_recovery.py ferrisync-python/tests/test_cancellation.py ferrisync-python/tests/test_concurrency.py ferrisync-python/tests/test_watch_lifecycle.py ferrisync-python/tests/test_flutter_interop.py
      - name: Run Python tests
        run: python -m pytest ferrisync-python/tests -q -m "not interop and not reliability and not slow and not flutter"

  python-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip maturin pytest ruff mypy
      - name: Build and install Python bindings
        run: python -m pip install ./ferrisync-python
      - name: Build FerriSync CLI
        run: cargo build -p ferrisync
      - name: Run Python interoperability and reliability tests
        run: python -m pytest ferrisync-python/tests -q -m "(interop or reliability) and not flutter"

  python-flutter-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.2'
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ninja-build libgtk-3-dev clang cmake pkg-config
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip maturin pytest ruff mypy
      - name: Build and install Python bindings
        run: python -m pip install ./ferrisync-python
      - name: Flutter pub get
        working-directory: ferrisync-flutter
        run: flutter pub get
      - name: Run Python <-> Flutter interoperability test
        run: xvfb-run -a python -m pytest ferrisync-python/tests/test_flutter_interop.py -q -m "flutter"

