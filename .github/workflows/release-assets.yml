name: Build release assets

# Builds the prebuilt binaries for a FerriSync release. It does NOT create or
# publish a GitHub Release — download the final artifact from the workflow run
# and attach it to the release yourself.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label used in asset names (e.g. 0.1.0)'
        required: true
        default: '0.1.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  cli-linux:
    name: CLI · Linux x86_64 (static musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build static CLI
        run: cargo build -p ferrisync --release --target x86_64-unknown-linux-musl
      - name: Stage asset
        run: |
          version="${RELEASE_VERSION#v}"
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/ferrisync \
            "dist/ferrisync-${version}-linux-x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error

  cli-macos:
    name: CLI · macOS universal (x86_64 + arm64)
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build both architectures
        run: |
          cargo build -p ferrisync --release --target aarch64-apple-darwin
          cargo build -p ferrisync --release --target x86_64-apple-darwin
      - name: Create universal binary and stage asset
        run: |
          version="${RELEASE_VERSION#v}"
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/ferrisync \
            target/x86_64-apple-darwin/release/ferrisync \
            -o "dist/ferrisync-${version}-macos-universal"
          chmod +x "dist/ferrisync-${version}-macos-universal"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-macos-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error

  cli-windows:
    name: CLI · Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build CLI
        run: cargo build -p ferrisync --release --target x86_64-pc-windows-msvc
      - name: Stage asset
        run: |
          version="${RELEASE_VERSION#v}"
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/ferrisync.exe \
            "dist/ferrisync-${version}-windows-x86_64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-windows-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error

  android-apk:
    name: Android · arm64 release APK (unsigned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.2'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          add-to-path: false
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Flutter dependencies
        working-directory: ferrisync-flutter
        run: flutter pub get
      - name: Build release APK
        working-directory: ferrisync-flutter
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify and stage asset
        run: |
          version="${RELEASE_VERSION#v}"
          apk="ferrisync-flutter/build/app/outputs/flutter-apk/app-release.apk"
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libferrisync_core.so' || {
            echo "error: APK is missing lib/arm64-v8a/libferrisync_core.so" >&2
            exit 1
          }
          unexpected=$(unzip -Z1 "$apk" | grep '^lib/' \
            | sed 's#^lib/\([^/]*\)/.*#\1#' | sort -u | grep -v '^arm64-v8a$' || true)
          [ -z "$unexpected" ] || {
            echo "error: APK contains unexpected ABIs: $unexpected" >&2
            exit 1
          }
          mkdir -p dist
          cp "$apk" "dist/ferrisync-${version}-android-arm64-unsigned.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error

  package:
    name: Package assets + SHA256SUMS
    runs-on: ubuntu-latest
    needs: [cli-linux, cli-macos, cli-windows, android-apk]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        id: meta
        run: |
          version="${RELEASE_VERSION#v}"
          cd dist
          sha256sum * > SHA256SUMS
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ferrisync-${{ steps.meta.outputs.version }}-release-assets
          path: dist/*
          if-no-files-found: error
