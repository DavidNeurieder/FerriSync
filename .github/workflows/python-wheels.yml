name: Python wheels (build, verify & TestPyPI)

on:
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: 'Publish built artifacts to TestPyPI and run install smoke test'
        required: false
        type: boolean
        default: false
      version:
        description: 'Version label (informational; package version comes from pyproject/Cargo)'
        required: false
        default: '0.1.0'

permissions:
  contents: read

jobs:
  build-linux:
    name: Build wheels (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Version consistency check (source)
        run: python3 scripts/check_python_version.py --skip-import
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ferrisync-python
          command: build
          args: --release --out dist
          manylinux: auto
      - name: Auditwheel check
        run: |
          python -m pip install --upgrade auditwheel
          for whl in ferrisync-python/dist/*.whl; do
            echo "==> auditwheel show $whl"
            auditwheel show "$whl" || true
          done
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ferrisync-python
          command: sdist
          args: --out dist
      - name: Verify wheel in clean venv
        run: |
          python -m venv /tmp/ferrisync-wheel-venv
          . /tmp/ferrisync-wheel-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links ferrisync-python/dist ferrisync
          python -c "import ferrisync; print(ferrisync.__version__)"
          python scripts/check_python_version.py
          python -m pip check
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import ferrisync

          with tempfile.TemporaryDirectory() as a, tempfile.TemporaryDirectory() as b, \
               tempfile.TemporaryDirectory() as da, tempfile.TemporaryDirectory() as db:
              sa, sb = Path(a), Path(b)
              (sa / "from_server.txt").write_text("server", encoding="utf-8")
              (sb / "from_client.txt").write_text("client", encoding="utf-8")
              with ferrisync.Client(da) as server, ferrisync.Client(db) as client:
                  fid = server.add_folder(sa, server.device_id, "bidirectional")
                  port = server.serve(fid, sa, port=0, auto_accept=True)
                  peer = client.pair("127.0.0.1", port)
                  cf = client.add_folder(sb, peer, "bidirectional")
                  res = client.sync(cf, sb, "127.0.0.1", port, peer)
                  assert res.success
                  assert (sb / "from_server.txt").read_text(encoding="utf-8") == "server"
                  assert (sa / "from_client.txt").read_text(encoding="utf-8") == "client"
          print("wheel smoke sync ok")
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist-linux-x86_64
          path: ferrisync-python/dist/*
          if-no-files-found: error

  build-linux-aarch64:
    name: Build wheels (Linux aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ferrisync-python
          command: build
          args: --release --out dist
          manylinux: auto
      - name: Auditwheel check
        run: |
          python -m pip install --upgrade auditwheel
          for whl in ferrisync-python/dist/*.whl; do
            echo "==> auditwheel show $whl"
            auditwheel show "$whl" || true
          done
      - name: Verify wheel in clean venv
        run: |
          python -m venv /tmp/ferrisync-wheel-venv
          . /tmp/ferrisync-wheel-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links ferrisync-python/dist ferrisync
          python -c "import ferrisync; print(ferrisync.__version__)"
          python scripts/check_python_version.py
          python -m pip check
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import ferrisync

          with tempfile.TemporaryDirectory() as a, tempfile.TemporaryDirectory() as b,                tempfile.TemporaryDirectory() as da, tempfile.TemporaryDirectory() as db:
              sa, sb = Path(a), Path(b)
              (sa / "from_server.txt").write_text("server", encoding="utf-8")
              (sb / "from_client.txt").write_text("client", encoding="utf-8")
              with ferrisync.Client(da) as server, ferrisync.Client(db) as client:
                  fid = server.add_folder(sa, server.device_id, "bidirectional")
                  port = server.serve(fid, sa, port=0, auto_accept=True)
                  peer = client.pair("127.0.0.1", port)
                  cf = client.add_folder(sb, peer, "bidirectional")
                  res = client.sync(cf, sb, "127.0.0.1", port, peer)
                  assert res.success
                  assert (sb / "from_server.txt").read_text(encoding="utf-8") == "server"
                  assert (sa / "from_client.txt").read_text(encoding="utf-8") == "client"
          print("wheel smoke sync ok")
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist-linux-aarch64
          path: ferrisync-python/dist/*
          if-no-files-found: error

  build-macos:
    name: Build wheels (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: x86_64
            args: --release --out dist --target x86_64-apple-darwin
          - os: macos-14
            target: aarch64
            args: --release --out dist --target aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'x86_64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ferrisync-python
          command: build
          args: ${{ matrix.args }}
      - name: Verify wheel in clean venv
        run: |
          python3 -m venv /tmp/ferrisync-wheel-venv
          . /tmp/ferrisync-wheel-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links ferrisync-python/dist ferrisync
          python -c "import ferrisync; print(ferrisync.__version__)"
          python scripts/check_python_version.py
          python -m pip check
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import ferrisync

          with tempfile.TemporaryDirectory() as a, tempfile.TemporaryDirectory() as b, \
               tempfile.TemporaryDirectory() as da, tempfile.TemporaryDirectory() as db:
              sa, sb = Path(a), Path(b)
              (sa / "from_server.txt").write_text("server", encoding="utf-8")
              (sb / "from_client.txt").write_text("client", encoding="utf-8")
              with ferrisync.Client(da) as server, ferrisync.Client(db) as client:
                  fid = server.add_folder(sa, server.device_id, "bidirectional")
                  port = server.serve(fid, sa, port=0, auto_accept=True)
                  peer = client.pair("127.0.0.1", port)
                  cf = client.add_folder(sb, peer, "bidirectional")
                  res = client.sync(cf, sb, "127.0.0.1", port, peer)
                  assert res.success
                  assert (sb / "from_server.txt").read_text(encoding="utf-8") == "server"
                  assert (sa / "from_client.txt").read_text(encoding="utf-8") == "client"
          print("wheel smoke sync ok")
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist-macos-${{ matrix.target }}
          path: ferrisync-python/dist/*
          if-no-files-found: error

  build-windows:
    name: Build wheels (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ferrisync-python
          command: build
          args: --release --out dist
      - name: Verify wheel in clean venv
        shell: bash
        run: |
          python -m venv /tmp/ferrisync-wheel-venv
          source /tmp/ferrisync-wheel-venv/Scripts/activate
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links ferrisync-python/dist ferrisync
          python -c "import ferrisync; print(ferrisync.__version__)"
          python scripts/check_python_version.py
          python -m pip check
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import ferrisync

          with tempfile.TemporaryDirectory() as a, tempfile.TemporaryDirectory() as b, \
               tempfile.TemporaryDirectory() as da, tempfile.TemporaryDirectory() as db:
              sa, sb = Path(a), Path(b)
              (sa / "from_server.txt").write_text("server", encoding="utf-8")
              (sb / "from_client.txt").write_text("client", encoding="utf-8")
              with ferrisync.Client(da) as server, ferrisync.Client(db) as client:
                  fid = server.add_folder(sa, server.device_id, "bidirectional")
                  port = server.serve(fid, sa, port=0, auto_accept=True)
                  peer = client.pair("127.0.0.1", port)
                  cf = client.add_folder(sb, peer, "bidirectional")
                  res = client.sync(cf, sb, "127.0.0.1", port, peer)
                  assert res.success
                  assert (sb / "from_server.txt").read_text(encoding="utf-8") == "server"
                  assert (sa / "from_client.txt").read_text(encoding="utf-8") == "client"
          print("wheel smoke sync ok")
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist-windows-x86_64
          path: ferrisync-python/dist/*
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    if: ${{ inputs.publish_testpypi }}
    needs: [build-linux, build-linux-aarch64, build-macos, build-windows]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/ferrisync/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true
      - name: List distributions
        run: ls -lah dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true

  testpypi-install-smoke:
    name: TestPyPI install smoke (${{ matrix.os }})
    if: ${{ inputs.publish_testpypi }}
    needs: publish-testpypi
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install from TestPyPI and smoke test
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -m venv /tmp/testpypi-venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then source /tmp/testpypi-venv/Scripts/activate; else source /tmp/testpypi-venv/bin/activate; fi
          python -m pip install --upgrade pip
          python -m pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple ferrisync==${EXPECTED_VERSION}
          python -c "import ferrisync; print(ferrisync.__version__)"
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import ferrisync

          with tempfile.TemporaryDirectory() as a, tempfile.TemporaryDirectory() as b, \
               tempfile.TemporaryDirectory() as da, tempfile.TemporaryDirectory() as db:
              sa, sb = Path(a), Path(b)
              (sa / "s.txt").write_text("s", encoding="utf-8")
              (sb / "c.txt").write_text("c", encoding="utf-8")
              with ferrisync.Client(da) as server, ferrisync.Client(db) as client:
                  fid = server.add_folder(sa, server.device_id, "bidirectional")
                  port = server.serve(fid, sa, port=0, auto_accept=True)
                  peer = client.pair("127.0.0.1", port)
                  cf = client.add_folder(sb, peer, "bidirectional")
                  res = client.sync(cf, sb, "127.0.0.1", port, peer)
                  assert res.success
          print("testpypi smoke ok")
          PY
