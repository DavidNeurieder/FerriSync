name: ferrisync
description: Decentralized folder sync
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.2.0

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: ^2.0.0
  riverpod: ^2.5.0
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  mobile_scanner: ^6.0.0
  file_picker: ^8.0.0
  path_provider: ^2.1.0
  intl: ^0.19.0
  freezed_annotation: ^2.4.0
  permission_handler: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  freezed: ^2.5.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets: []
