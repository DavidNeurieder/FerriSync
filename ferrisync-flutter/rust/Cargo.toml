[workspace]

[package]
name = "ferrisync_flutter"
version = "0.1.0"
edition = "2021"

[dependencies]
ferrisync-core = { path = "../../ferrisync-core" }
flutter_rust_bridge = "=2.12.0"

[lib]
# Must match the stem flutter_rust_bridge's generated loader expects
# (libferrisync_core.so), which derives from the frb-annotated crate
# name in ../ferrisync-core.
name = "ferrisync_core"
crate-type = ["cdylib", "staticlib"]
