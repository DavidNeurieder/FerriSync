License: AGPL-3.0-only
AuthorName: FerriSync Contributors
WebSite: https://github.com/DavidNeurieder/FerriSync
SourceCode: https://github.com/DavidNeurieder/FerriSync
IssueTracker: https://github.com/DavidNeurieder/FerriSync/issues

RepoType: git
Repo: https://github.com/DavidNeurieder/FerriSync.git

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: v0.1.0
    subdir: ferrisync-flutter
    srclibs:
      - flutter@3.41.2
    sudo:
      - apt-get update
      - apt-get install -y clang cmake ninja-build pkg-config
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$$flutter$$" "$ANDROID_SDK_ROOT" > android/local.properties
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - git clone --depth 1 https://github.com/rust-lang/rustup /home/vagrant/rustup
      - bash /home/vagrant/rustup/rustup-init.sh -y --default-toolchain 1.80.0 --target aarch64-linux-android --target x86_64-linux-android
      - . /home/vagrant/.cargo/env
      - cargo install cargo-ndk --locked
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - . /home/vagrant/.cargo/env
      - export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
      - $$flutter$$/bin/flutter build apk --release
    ndk: 28.2.13676358
    output: build/app/outputs/flutter-apk/app-release.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.1.0
CurrentVersionCode: 1
